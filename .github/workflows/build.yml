name: Build Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_name: windows
            rust_targets: ''
            tauri_args: ''
          - platform: macos-latest
            os_name: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      # Opt-in to Node 24 for JavaScript-based actions (Node 20 deprecated by GitHub)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.os_name }}

      - name: Install npm dependencies
        run: npm ci

      - name: Sanitize Tauri signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Strip all whitespace from the base64-encoded key in case GitHub
          # Secrets injected stray newlines/CR/spaces during paste.
          CLEAN_KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          if [ -z "$CLEAN_KEY" ]; then
            echo "WARNING: TAURI_SIGNING_PRIVATE_KEY secret is empty; signed update bundles will not be produced." >&2
          fi
          echo "::add-mask::$CLEAN_KEY"
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$RAW_PWD" >> "$GITHUB_ENV"

      - name: Build Tauri
        run: npm run tauri:build -- ${{ matrix.tauri_args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: gestion-inscriptions-${{ matrix.os_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: ignore

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  publish-updater-manifest:
    name: Publish updater manifest (latest.json)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Pull the .sig files from the release we just published
          mkdir -p sigs
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig' --dir sigs

          read_sig() {
            local pattern="$1"
            local f
            f=$(ls sigs/$pattern 2>/dev/null | head -n1 || true)
            if [ -n "$f" ]; then cat "$f"; else echo ""; fi
          }

          NSIS_SIG=$(read_sig '*x64-setup.nsis.zip.sig')
          if [ -z "$NSIS_SIG" ]; then NSIS_SIG=$(read_sig '*-setup.exe.sig'); fi
          MAC_SIG=$(read_sig '*.app.tar.gz.sig')

          NSIS_URL=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | select(.name | endswith("-setup.exe")) | .url' | head -n1)
          NSIS_ZIP_URL=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | select(.name | endswith("nsis.zip")) | .url' | head -n1)
          MAC_URL=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | select(.name | endswith(".app.tar.gz")) | .url' | head -n1)

          WIN_URL="$NSIS_ZIP_URL"
          [ -z "$WIN_URL" ] && WIN_URL="$NSIS_URL"

          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Voir les notes de version sur GitHub.",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$NSIS_SIG",
                "url": "$WIN_URL"
              },
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "$MAC_URL"
              },
              "darwin-x86_64": {
                "signature": "$MAC_SIG",
                "url": "$MAC_URL"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

      - name: Attach latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" latest.json --repo "${GITHUB_REPOSITORY}" --clobber
